<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#2F80ED">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="English Flash Cards">
<meta name="format-detection" content="telephone=no">
<title>English Flash Cards</title>

<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon/icon-192.png">
<link rel="icon" href="icon/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="app">

<header class="header">
<h1>English Flash Cards</h1>
<p class="version">Version 2.0</p>
</header>

<section class="progressSection" aria-label="Progress">
<div class="progressContainer">
<div class="progressBackground">
<div id="progressBar" class="progressBar"></div>
</div>
</div>
<div id="progressText" class="progressText">0 / 0</div>
</section>

<main class="mainContent">

<section class="flashCard" aria-label="Flash Card">
<div id="jp" class="jp"></div>
<div id="countdown" class="countdown"></div>
<div id="en" class="en"></div>
</section>

<nav class="controlArea" aria-label="Controls">
<button id="prevButton" type="button" onclick="prevCard()">◀ Previous</button>
<button id="speakButton" type="button" onclick="speak()">🔊 Speak</button>
<button id="nextButton" type="button" onclick="nextCard()">Next ▶</button>
</nav>

<section class="jumpSection">
<label for="jumpNo">Card Number</label>
<input id="jumpNo" type="number" min="1" step="1" inputmode="numeric" autocomplete="off">
<button id="jumpButton" type="button" onclick="jumpCard()">Go</button>
</section>

</main>

<footer class="footer">
<p>English Flash Cards Version 2.0</p>
</footer>

</div>

<noscript>
<p>This application requires JavaScript.</p>
</noscript>

<script src="cards.js"></script>
<script src="app.js"></script>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("service-worker.js")
      .catch(err => console.error(err));
  });
}
</script>

</body>
</html>
